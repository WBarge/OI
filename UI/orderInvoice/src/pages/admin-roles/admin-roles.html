<p-confirmdialog />

<h2>Roles</h2>

<p>A role says what a user may do. Give roles to users on the Users page.</p>

<div class="addRole">
  <input pInputText type="text" id="newRoleName" placeholder="New role name" aria-label="New role name" maxlength="50"
         [ngModel]="newRole()" (ngModelChange)="newRole.set($event)" (keyup.enter)="add()" />
  <button pButton type="button" id="addRole" [disabled]="!canAdd()" (click)="add()">{{ adding() ? 'Adding...' : 'Add role' }}</button>
</div>

<p-table id="roleTable" [value]="rows()" dataKey="name" [loading]="loading()">
  <ng-template #header>
    <tr>
      <th>Role</th>
      <th>Users</th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template #body let-role>
    <tr class="roleRow">
      <td class="roleName">
        {{ role.name }}
        @if (role.isBuiltIn) {
          <p-tag value="Built in" severity="secondary" class="chip" />
        }
      </td>
      <td class="roleUsers">{{ role.userCount }}</td>
      <td>
        <button pButton type="button" size="small" severity="danger" class="deleteRole"
                [disabled]="!canDelete(role)" [attr.title]="whyNotDeletable(role)" (click)="remove(role)">Delete</button>
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr><td colspan="3">No roles.</td></tr>
  </ng-template>
</p-table>
