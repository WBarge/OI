<p-table id="orderTable" #orderTable
[value]="orders"
selectionMode="single"
(onRowSelect)="onSelect($event)"
[paginator]="true"
[alwaysShowPaginator]="true"
[totalRecords]="totalItems"
[lazy]="true"
(onLazyLoad)="loadOrdersLazy($event)"
(onPage)="pageChange($event)"
[rowsPerPageOptions]="[10, 25, 50]"
[rows]="pageSize"
[showCurrentPageReport]="true"
currentPageReportTemplate="{first}-{last} of {totalRecords}"
>
  <ng-template #header>
    <tr>
      <th>Order #</th>
      <th>Customer
        <p-column-filter type="text" field="sku" display="menu" />
      </th>
      <th>Phone Number
        <p-column-filter type="text" field="name" display="menu" />
      </th>
      <th>Order Date
        <p-column-filter type="text" field="shortDescription" display="menu" />
      </th>
      <th>Total</th>
    </tr>
  </ng-template>
  <ng-template #body let-order>
    <tr [pSelectableRow]="order">
      <td>{{order.orderNumber}}</td>
      <td>{{order.customerName}}</td>
      <td>{{order.phoneNumber | phoneFormat}}</td>
      <td>{{order.orderDate | date:'MM/dd/yyyy'}}</td>
      <td>{{order.total | currency}}</td>
    </tr>
  </ng-template>
</p-table>
