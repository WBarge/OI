<p-fieldset legend="Quick Create">
  <p-toolbar>
    <ng-template #start>
    </ng-template>
    <ng-template #center>
    </ng-template>
    <ng-template #end>
        <button type="button" pButton >Create</button>
    </ng-template>
  </p-toolbar>
odule
</p-fieldset>

<p-table id="customerTable" #customerTable
[value]="customers"
[paginator]="true"
[alwaysShowPaginator]="true"
[totalRecords]="totalItems"
[lazy]="true"
(onLazyLoad)="loadCustomersLazy($event)"
(onPage)="pageChange($event)"
[rowsPerPageOptions]="[10, 25, 50]"
[rows]="pageSize"
[showCurrentPageReport]="true"
currentPageReportTemplate="{first}-{last} of {totalRecords}"
>
  <ng-template #header>
    <tr>
      <th colspan="5" class="gridHeader" >Customers</th>
    </tr>
    <tr>
      <th>First Name
        <p-column-filter type="text" field="FirstName" display="menu" />
      </th>
      <th>Last Name
        <p-column-filter type="text" field="LastName" display="menu" />
      </th>
      <th>Phone Number
        <p-column-filter type="text" field="PhoneNumber" display="menu" />
      </th>
    </tr>
  </ng-template>
  <ng-template #body let-customer>
    <tr>
      <td>{{customer.firstName}}</td>
      <td>{{customer.lastName}}</td>
      <td>{{customer.phoneNumber |phoneFormat}}</td>
    </tr>
  </ng-template>
</p-table>
