<div class="authPage">
  <p-card class="authCard" [header]="title">
    @if (unavailable()) {
      <p-message severity="error" class="authMessage" role="alert">Sign-in is not available right now. Try again in a moment.</p-message>
    } @else {
      <p-message severity="info" class="authMessage" role="status">You have been signed out.</p-message>
    }
    <button type="button" pButton class="authButton" [disabled]="starting()" (click)="signIn()">Sign in</button>
  </p-card>
</div>
